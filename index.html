<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор випадкових рецептів на вечерю</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🍳 Генератор рецептів на вечерю</h1>
        <p class="subtitle">Не знаєте що приготувати? Довіртеся випадковому вибору!</p>

        <!-- Елементи керування та анімації -->
        <div class="generator-box">
            <div class="icon-container" id="iconContainer">
                <span class="cooking-icon">🍲</span>
            </div>
            <button id="generateBtn" class="btn">Згенерувати рецепт</button>
        </div>

        <!-- Область виведення результату -->
        <div id="recipeResult" class="recipe-card hidden">
            <!-- Згенерований рецепт з'явиться тут -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
